bundle:
  name: atlas-foncier

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID
  genie_space_id:
    description: Genie space ID (PLU Reglement - Q&A)

resources:
  apps:
    app:
      name: "atlas-foncier"
      description: "Atlas Foncier - potentiel foncier et energetique des batiments parisiens"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      # On-behalf-of-user scopes: the genie plugin calls the Genie space as the
      # signed-in user (its SQL runs on the warehouse with the user's grants).
      user_api_scopes:
        - sql
        - dashboards.genie
        # The Genie conversation API now checks the `genie` scope.
        - genie

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: genie-space
          genie_space:
            name: "PLU Reglement - Q&A"
            space_id: ${var.genie_space_id}
            permission: CAN_RUN

targets:
  default:
    default: true
    workspace:
      host: https://dbc-1006f51d-8881.cloud.databricks.com

    variables:
      sql_warehouse_id: 813f5c9517aee0df
      genie_space_id: 01f1b74de1e017db858e23e4b1db2bfe
